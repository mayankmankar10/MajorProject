version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: manpower_backend
    ports:
      - "8000:8000"
    volumes:
      # Mount existing database to persist data
      - ./manpower.db:/app/manpower.db
      # Mount FAISS indexes to persist vector embeddings
      - ./backend/db/faiss_indexes:/app/backend/db/faiss_indexes
      # Mount vectors directory if it exists
      - ./vectors:/app/vectors
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DATABASE_URL=sqlite:///./manpower.db
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - manpower_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: manpower_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000
    restart: unless-stopped
    networks:
      - manpower_network

networks:
  manpower_network:
    driver: bridge

volumes:
  # Named volumes for data persistence
  db_data:
  vector_data:
